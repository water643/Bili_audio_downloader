<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - B站音频下载器</title>
    <link rel="stylesheet" href="/static/css/style.css?v=20">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <a href="/" class="icon-btn" title="返回">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
                <div class="logo">设置</div>
            </div>
        </header>

        <main class="content">
            <section class="card">
                <div class="card-title">B站账号</div>

                <div class="field">
                    <div class="account-status" id="accountStatus">
                        <span class="account-dot"></span>
                        <span class="account-text" id="accountText">未检测</span>
                    </div>
                </div>

                <div class="field">
                    <div class="btn-group">
                        <button class="btn-primary" id="browserLoginBtn" onclick="openBuiltinBrowserLogin()">打开内置浏览器登录</button>
                        <button class="btn-ghost" id="checkBtn" onclick="checkCookies()">检查登录状态</button>
                        <button class="btn-ghost" id="clearBtn" onclick="clearCookies()">清除 Cookie</button>
                    </div>
                </div>

                <div class="file-hint" id="loginHint">
                    点击"打开内置浏览器登录"，在弹出的窗口中登录 B站账号。登录成功后窗口自动关闭。
                </div>
            </section>

            <section class="card">
                <div class="card-title">下载</div>
                <div class="field">
                    <label>音频质量</label>
                    <div class="radio-group">
                        <label><input type="radio" name="audioQuality" value="hires"> Hi-Res</label>
                        <label><input type="radio" name="audioQuality" value="standard"> 标准</label>
                        <label><input type="radio" name="audioQuality" value="mp3"> 兼容</label>
                    </div>
                    <div class="file-hint">Hi-Res 需要 B站大会员权限</div>
                </div>
            </section>

            <section class="card">
                <div class="card-title">下载引擎</div>
                <div class="field">
                    <label class="switch-row">
                        <input type="checkbox" id="useAria2">
                        <span>使用 aria2c 多线程下载</span>
                    </label>
                    <div class="file-hint" id="aria2Status"></div>
                </div>

                <div id="aria2Options" style="display:none">
                    <div class="field">
                        <label>线程数</label>
                        <div class="slider-row">
                            <input type="range" id="aria2Threads" min="1" max="16"
                                   step="1" value="16" class="slider">
                            <span class="value-badge" id="aria2ThreadsLabel">16</span>
                        </div>
                    </div>
                    <div class="field">
                        <label>分片数</label>
                        <div class="slider-row">
                            <input type="range" id="aria2Splits" min="1" max="16"
                                   step="1" value="16" class="slider">
                            <span class="value-badge" id="aria2SplitsLabel">16</span>
                        </div>
                    </div>
                    <div class="field">
                        <button class="btn-ghost" id="installAria2Btn" onclick="installAria2()">安装 / 重装 aria2c</button>
                        <div class="file-hint" id="aria2Hint"></div>
                    </div>
                </div>
            </section>

            <section class="card">
                <div class="card-title">默认值</div>
                <div class="field">
                    <label>默认保存目录</label>
                    <input type="text" id="defaultSaveDir" class="input">
                </div>
                <div class="field">
                    <label>默认音量倍数</label>
                    <div class="slider-row">
                        <input type="range" id="defaultVolume" min="0.1" max="3.0"
                               step="0.05" value="1.0" class="slider">
                        <span class="value-badge" id="defaultVolumeLabel">1.00x</span>
                    </div>
                </div>
                <div class="field">
                    <label>默认 MP3 码率</label>
                    <div class="radio-group">
                        <label><input type="radio" name="defaultQuality" value="128"> 128k</label>
                        <label><input type="radio" name="defaultQuality" value="192"> 192k</label>
                        <label><input type="radio" name="defaultQuality" value="256"> 256k</label>
                        <label><input type="radio" name="defaultQuality" value="320"> 320k</label>
                    </div>
                </div>
                <div class="field">
                    <label>默认目标响度 (LUFS)</label>
                    <div class="slider-row">
                        <input type="range" id="defaultTargetLufs" min="-24" max="-10"
                               step="0.5" value="-16" class="slider">
                        <span class="value-badge" id="defaultTargetLufsLabel">-16.0</span>
                    </div>
                </div>
            </section>

            <div class="actions">
                <button class="btn-primary" onclick="saveSettings()">保存设置</button>
                <button class="btn-ghost" onclick="resetSettings()">重置为默认</button>
            </div>
            <div class="file-hint" id="saveHint" style="text-align:center;margin-top:-6px;"></div>
        </main>
    </div>

    <script src="/static/js/settings.js?v=20"></script>
</body>
</html>
